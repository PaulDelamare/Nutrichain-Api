name: API CD (image Docker)

# Ce workflow ne fait QUE publier l'image. Il ne rejoue plus lint/tests/build : il attend que la
# barrière de qualité (`CI/CD Pipeline Nutrichain`) soit passée au vert sur `main`.
#
# Avant, les deux workflows avaient des trous complémentaires — celui-ci construisait et déployait
# sans lint, sans typage et sans couverture, sur Node 22 alors que l'image tourne sur Node 20 ;
# l'autre vérifiait sans déployer. Une image pouvait donc être publiée sur du code que rien n'avait
# linté. Désormais : une seule barrière, un seul déploiement.
on:
  workflow_run:
    workflows: ['CI/CD Pipeline Nutrichain']
    branches: [main]
    types: [completed]

jobs:
  cd:
    name: Publier l'image sur GHCR
    runs-on: ubuntu-latest
    # Publication uniquement si la barrière de qualité a réussi.
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      # On construit EXACTEMENT le commit qui a été vérifié, pas la tête de branche.
      - name: 📥 Checkout du commit vérifié
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔐 Connexion au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔡 Nom de dépôt en minuscules
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Deux étiquettes : `latest` pour la commodité, le SHA pour pouvoir revenir en arrière —
      # « quel commit tourne ? » doit avoir une réponse.
      - name: 🐳 Construire et publier l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/api-nutrichain:latest
            ghcr.io/${{ steps.repo.outputs.name }}/api-nutrichain:${{ github.event.workflow_run.head_sha }}
