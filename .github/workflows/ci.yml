name: CI/CD Pipeline Nutrichain

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Une PR qui reçoit plusieurs pushes n'occupe pas un runner par push : seul le dernier compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` et non `npm install` : installe EXACTEMENT le lock, comme le Dockerfile. Sinon la
      # CI peut être verte sur un arbre de dépendances que personne n'a jamais eu.
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🧹 Run Linter (ESLint)
        run: npm run lint

      # Une erreur de typage se mergeait en vert : rien n'appelait `tsc` (Vitest transpile sans
      # vérifier les types, ESLint ne les regarde pas).
      - name: 🔎 Type check
        run: npx tsc -p tsconfig.check.json

      # Le build n'était vérifié que sur `main`, en retard de plusieurs centaines de commits : une
      # compilation cassée pouvait donc vivre longtemps sur `develop`.
      - name: 🏗️ Build
        run: npm run build

      # Avec couverture : le plancher de 70 % exigé par le cahier des charges était configuré dans
      # `vitest.config.mjs` mais aucun workflow ne l'exerçait — il ne garantissait donc rien.
      - name: 🧪 Run Unit Tests (Vitest) + couverture
        env:
          API_KEY: 'secret-key-pour-les-tests'
          NODE_ENV: 'test'
        run: npm run test:coverage

      - name: 📊 Publier le taux de couverture
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Couverture non produite (les tests ont échoué avant)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const ligne = (nom, m) => \`| \${nom} | \${m.pct}% | \${m.covered}/\${m.total} |\`;
            const out = [
              '### Couverture de tests (plancher : 70 %)', '',
              '| Mesure | Taux | Couvert |', '|---|---|---|',
              ligne('Lignes', t.lines), ligne('Branches', t.branches),
              ligne('Fonctions', t.functions), ligne('Instructions', t.statements),
            ].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            console.log(out);
          "

      - name: 📦 Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api
          path: coverage/
          retention-days: 14

  # Les tests unitaires mockent Prisma : ils ne prouvent RIEN du SQL brut ni des clés étrangères.
  # Ce job joue des scénarios e2e contre de VRAIES bases (PostgreSQL + MongoDB), là où le moteur
  # accepte ou rejette pour de bon. Job séparé : il ne fragilise pas le check requis, et n'exécute
  # qu'un sous-ensemble éprouvé, séquentiel (les scripts partagent l'org du seed et se marcheraient
  # dessus en parallèle).
  e2e-tests:
    name: E2E (PostgreSQL + MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrichain
          POSTGRES_PASSWORD: nutrichain
          POSTGRES_DB: nutrichain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrichain"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      # Valeurs de TEST (bases éphémères du runner) — aucun secret de production. Les scripts e2e
      # lisent via `tsx --env-file=.env` ; Prisma charge aussi ce fichier. SMTP pointe vers un port
      # fermé : `transporter.verify()` échoue vite et proprement (envois fire-and-forget catchés),
      # sans jamais sortir sur le réseau.
      - name: 🔐 Écrire le .env de test
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://nutrichain:nutrichain@localhost:5432/nutrichain?schema=public
          MONGO_URI=mongodb://localhost:27017/nutrichain-logs
          API_KEY=secret-key-pour-les-tests
          IOT_API_KEY=iot-key-pour-les-tests
          API_KEY_ORG_ID=usine-laitiere-paris
          BETTER_AUTH_SECRET=secret-de-test-au-moins-32-caracteres-xyz
          BETTER_AUTH_URL=http://localhost:3000
          API_URL=http://localhost:3000
          FRONTEND_URL=http://localhost:5173
          SMTP_HOST=localhost
          SMTP_PORT=1
          SMTP_SECURE=false
          SMTP_USER=test
          SMTP_PASS=test
          SMTP_FROM="NutriChain Test <no-reply@test.local>"
          NODE_ENV=test
          EOF

      - name: 🗄️ Appliquer les migrations
        run: npx prisma migrate deploy

      - name: 🌱 Seed de base (org + membres par rôle + référentiels)
        run: npx prisma db seed

      # Le jeu de démonstration ajoute lieux, matériels (avec capteurs) et lots : indispensable aux
      # scénarios réception/chaîne du froid (le seed de base ne crée ni équipement ni site).
      - name: 🌱 Seed de démonstration
        run: npm run seed:demo

      # Contre un vrai PostgreSQL, sans mock : contraintes, verrous, séquences, cascades — un mock
      # validerait un comportement qui n'existe pas (#150).
      - name: 🧪 Tests d'intégration (PostgreSQL réel, sans mock)
        run: npm run test:integration

      # Un step par scénario : le log dit immédiatement lequel casse. Séquence validée en local sur
      # base fraîche puis rejouée (idempotence 14/14), en conditions CI (NODE_ENV=test, SMTP fermé).
      # --- Audit WORM (orgs éphémères, sans dépendance au seed) ---
      - name: 🔗 Intégrité de la chaîne d'audit WORM
        run: npm run e2e:audit-verify
      - name: 🔗 Chaîne d'audit linéaire sous concurrence
        run: npm run e2e:audit-chain
      # --- Connecteurs & référentiels ---
      - name: 🔌 Import/export CSV connecteurs
        run: npm run e2e:connectors
      - name: 📏 Référentiel d'unités (source unique, FK)
        run: npm run e2e:units-referential
      # --- Réception, traçabilité, qualité ---
      - name: 📦 Réception amont et lien fournisseur
        run: npm run e2e:lot-fournisseur
      - name: 📦 Réception → lot → généalogie
        run: npm run e2e:batch-receipt
      - name: 🧬 Résolution de lot par numéro
        run: npm run e2e:resolution-lot
      - name: 📍 Déplacement d'un lot (position physique)
        run: npm run e2e:move-batch
      - name: 🔁 Idempotence de la transformation (pas de double prélèvement)
        run: npm run e2e:transformation-idempotency
      - name: 🛡️ Séparation des tâches qualité (RBAC)
        run: npm run e2e:quality-gate
      - name: 🚧 Quarantaine et levée
        run: npm run e2e:quarantine
      - name: ❄️ Levée de quarantaine froid — restauration du statut (HACCP)
        run: npm run e2e:quarantine-restore
      - name: 🔴 Rappel produit — propagation à la descendance
        run: npm run e2e:recall
      # --- Chaîne du froid IoT (Postgres + Mongo + audit) ---
      # Ce scénario a rougi par intermittence sur le runner (`1 Alert ACTIVE créée (reçu 0)`).
      # La cause n'était pas Mongo mais le verrou de détection : pris en session par une requête et
      # relâché par une autre, il partait sur une autre connexion du pool et restait détenu, ce qui
      # éteignait silencieusement toute détection suivante. Le verrou est désormais pris dans la
      # transaction ; le scénario ci-dessous verrouille cette garantie.
      - name: 🌡️ Excursion thermique → alerte + quarantaine
        run: npm run e2e:iot-alert
      - name: 🔒 Le verrou de détection ne fuite pas (détections concurrentes)
        run: npm run e2e:iot-advisory-lock
      # Ces deux scénarios avaient été sortis du job pour la même intermittence : ils enchaînent
      # détection, résolution puis ré-ingestion, donc ils rejouaient le verrou plusieurs fois et
      # tombaient d'autant plus souvent sur celui qui avait fuité. La cause étant traitée, ils
      # reviennent dans le job — c'est lui qui dira s'il restait autre chose.
      - name: 🧊 Excursion → lots bloqués, levée ciblée
        run: npm run e2e:alerte-lots
      - name: 🧊 Résolution d'alerte tracée
        run: npm run e2e:alert-resolve

      # Les scénarios ci-dessous frappent l'API par HTTP (sécurité, RBAC, sync mobile, EPCIS) : ils
      # exigent un serveur en marche. On le démarre en arrière-plan et on attend qu'il réponde.
      - name: 🚀 Démarrer l'API en arrière-plan
        run: |
          npx tsx src/server.ts > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "API prête après ${i} tentative(s)."; exit 0
            fi
            sleep 2
          done
          echo "::error::L'API n'a pas démarré à temps"; cat server.log; exit 1

      # Ordre imposé : les deux tests de REJET d'authentification (allowlist, passthrough org)
      # saturent volontairement le limiteur anti-bruteforce par IP — en mémoire, partagé sur le
      # runner. Les jouer EN DERNIER évite qu'ils verrouillent les connexions des scénarios suivants.
      - name: 🔑 Clé API applicative — durcissement
        run: npm run e2e:api-key
      - name: 📦 SSCC concurrents (pas de doublon)
        run: npm run e2e:sscc
      - name: 🏷️ Événements EPCIS (Object/Transformation/Aggregation)
        run: npm run e2e:epcis
      - name: 📷 Étiquette GS1 — décodage optique et résolution du scan
        run: npm run e2e:label-scan
      - name: 📱 Sync mobile hors-ligne (idempotence)
        run: npm run e2e:sync
      - name: 🌐 Passerelle IoT liée à son tenant
        run: npm run e2e:iot-gateway
      - name: 🗂️ Données de référence (RBAC CRUD)
        run: npm run e2e:reference-data
      - name: 🗂️ Clients & produits (RBAC CRUD)
        run: npm run e2e:customer-product
      - name: 👥 Gestion des membres (RBAC)
        run: npm run e2e:members
      - name: 🔒 Allowlist Better-Auth (rejets)
        run: npm run e2e:auth-allowlist
      - name: 🔒 Passthrough organisation fermé (rejets)
        run: npm run e2e:org-passthrough

      - name: 🛑 Arrêter l'API
        if: always()
        run: if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
