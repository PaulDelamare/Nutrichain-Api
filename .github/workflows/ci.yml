name: CI/CD Pipeline Nutrichain

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Une PR qui reçoit plusieurs pushes n'occupe pas un runner par push : seul le dernier compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` et non `npm install` : installe EXACTEMENT le lock, comme le Dockerfile. Sinon la
      # CI peut être verte sur un arbre de dépendances que personne n'a jamais eu.
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🧹 Run Linter (ESLint)
        run: npm run lint

      # Une erreur de typage se mergeait en vert : rien n'appelait `tsc` (Vitest transpile sans
      # vérifier les types, ESLint ne les regarde pas).
      - name: 🔎 Type check
        run: npx tsc -p tsconfig.check.json

      # Le build n'était vérifié que sur `main`, en retard de plusieurs centaines de commits : une
      # compilation cassée pouvait donc vivre longtemps sur `develop`.
      - name: 🏗️ Build
        run: npm run build

      # Avec couverture : le plancher de 70 % exigé par le cahier des charges était configuré dans
      # `vitest.config.mjs` mais aucun workflow ne l'exerçait — il ne garantissait donc rien.
      - name: 🧪 Run Unit Tests (Vitest) + couverture
        env:
          API_KEY: 'secret-key-pour-les-tests'
          NODE_ENV: 'test'
        run: npm run test:coverage

      - name: 📊 Publier le taux de couverture
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Couverture non produite (les tests ont échoué avant)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const ligne = (nom, m) => \`| \${nom} | \${m.pct}% | \${m.covered}/\${m.total} |\`;
            const out = [
              '### Couverture de tests (plancher : 70 %)', '',
              '| Mesure | Taux | Couvert |', '|---|---|---|',
              ligne('Lignes', t.lines), ligne('Branches', t.branches),
              ligne('Fonctions', t.functions), ligne('Instructions', t.statements),
            ].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            console.log(out);
          "

      - name: 📦 Archiver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api
          path: coverage/
          retention-days: 14
